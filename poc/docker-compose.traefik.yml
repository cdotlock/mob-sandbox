services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      # File provider — no Docker socket needed
      - --providers.file.directory=/config
      - --providers.file.watch=true
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # ACME / Let's Encrypt via Porkbun DNS-01
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=porkbun
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      # Production Let's Encrypt (staging verified, switched to prod)
    environment:
      PORKBUN_API_KEY: ${PORKBUN_API_KEY}
      PORKBUN_SECRET_API_KEY: ${PORKBUN_SECRET_KEY}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/traefik/dynamic:/config:ro
      - traefik_certs:/letsencrypt
    networks:
      - edge

volumes:
  traefik_certs:

networks:
  edge:
    external: true
