name = "mob-power"
main = "src/index.js"
compatibility_date = "2024-09-23"
# Ed25519 in Web Crypto requires a recent compat date.

# --- Public variables (set these before deploying) ---
[vars]
# Vultr instance UUID — the VM you want to power-control.
VM_ID = "REPLACE_WITH_VULTR_INSTANCE_UUID"

# JSON array of authorized operators. Each entry needs:
#   name        — operator label (matches `mob-server operator add <name>`)
#   pubkey_b64  — base64 of the 32 raw ed25519 pubkey bytes
#                 (printed by `mob-server operator add` after registration)
#
# To regenerate this list from the server:
#   mob-server operator worker-config
AUTHORIZED_PUBKEYS = '''[
  {"name":"clock","pubkey_b64":"REPLACE_WITH_PUBKEY_B64"}
]'''

# Optional: max clock skew (seconds) between operator and Worker. Default 300.
# CLOCK_SKEW_SECONDS = "300"

# --- Secrets (set via `wrangler secret put`, never commit) ---
# wrangler secret put VULTR_API_KEY
